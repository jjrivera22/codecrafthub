<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #A78BFA;
        --success: #F59E0B;
        --success-dark: #D97706;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --bg: #0F0F1A;
        --surface: #1A1A2E;
        --surface-hover: #232340;
        --border: #2D2D44;
        --text: #E5E7EB;
        --text-muted: #9CA3AF;
        --text-dim: #6B7280;
        --radius: 12px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --transition: 0.2s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      .app-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .app-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .app-header .subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        margin-top: 0.3rem;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-title .icon {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        border-radius: 8px;
        font-size: 0.9rem;
      }

      /* Form Card */
      .form-card,
      .course-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .form-group label .req {
        color: var(--danger);
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        color: var(--text);
        font-size: 0.9rem;
        font-family: inherit;
        transition: border-color var(--transition);
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
        grid-column: 1 / -1;
      }

      /* Buttons */
      .btn {
        border: none;
        border-radius: 8px;
        padding: 0.6rem 1.3rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      .btn-success {
        background: var(--success);
        color: #1a1a2e;
      }

      .btn-success:hover:not(:disabled) {
        background: var(--success-dark);
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      .btn-danger:hover:not(:disabled) {
        background: var(--danger-dark);
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
      }

      .btn-ghost:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--text);
      }

      .btn-sm {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
      }

      /* Course List */
      .course-list {
        display: grid;
        gap: 1rem;
      }

      .course-card {
        margin-bottom: 0;
        transition: border-color var(--transition);
      }

      .course-card:hover {
        border-color: var(--primary-light);
      }

      .course-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }

      .course-name {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
      }

      .course-meta {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        font-size: 0.82rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
      }

      .course-meta span {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }

      .course-desc {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: 0.5rem 0 0.75rem;
      }

      .course-actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      /* Status Badges */
      .badge {
        display: inline-block;
        padding: 0.2rem 0.65rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .badge-not-started {
        background: rgba(156, 163, 175, 0.15);
        color: var(--text-muted);
        border: 1px solid rgba(156, 163, 175, 0.3);
      }

      .badge-in-progress {
        background: rgba(139, 92, 246, 0.15);
        color: var(--primary-light);
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      .badge-completed {
        background: rgba(245, 158, 11, 0.15);
        color: var(--success);
        border: 1px solid rgba(245, 158, 11, 0.3);
      }

      /* Spinner */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        gap: 1rem;
        color: var(--text-muted);
      }

      .loading-overlay .spinner {
        width: 32px;
        height: 32px;
        border-color: rgba(139, 92, 246, 0.2);
        border-top-color: var(--primary);
      }

      /* Toast / Messages */
      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 380px;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        border-radius: 8px;
        padding: 0.8rem 1rem;
        font-size: 0.88rem;
        box-shadow: var(--shadow);
        animation: slideIn 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .toast.success { border-left-color: var(--success); }
      .toast.error { border-left-color: var(--danger); }

      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      .toast.removing {
        animation: slideOut 0.3s ease forwards;
      }

      @keyframes slideOut {
        to { transform: translateX(100%); opacity: 0; }
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--text-muted);
      }

      .empty-state .emoji {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 1rem;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        width: 100%;
        max-width: 520px;
        box-shadow: var(--shadow);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .modal-header h2 {
        font-size: 1.15rem;
        font-weight: 600;
      }

      .modal-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
        padding: 0.2rem 0.4rem;
      }

      .modal-close:hover {
        color: var(--text);
      }

      .field-error {
        color: var(--danger);
        font-size: 0.78rem;
        margin-top: 0.2rem;
        display: none;
      }

      .field-error.visible {
        display: block;
      }

      .form-group input.error,
      .form-group textarea.error,
      .form-group select.error {
        border-color: var(--danger);
      }

      /* Responsive */
      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .app-header h1 {
          font-size: 1.4rem;
        }
        .course-card-header {
          flex-direction: column;
        }
        .course-actions {
          width: 100%;
        }
        .course-actions .btn {
          flex: 1;
          justify-content: center;
        }
        .container {
          padding: 1.5rem 1rem;
        }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <header class="app-header">
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
      <p class="subtitle">Track, manage, and complete your learning journey</p>
    </header>

    <div class="container">
      <!-- Add Course Form -->
      <h2 class="section-title">
        <span class="icon">+</span> Add New Course
      </h2>
      <div class="form-card">
        <form id="courseForm" class="form-grid" novalidate>
          <div class="form-group full">
            <label for="name">Course Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g. Advanced JavaScript" />
            <span class="field-error" data-for="name">Course name is required</span>
          </div>
          <div class="form-group full">
            <label for="description">Description <span class="req">*</span></label>
            <textarea id="description" name="description" placeholder="Brief description of the course"></textarea>
            <span class="field-error" data-for="description">Description is required</span>
          </div>
          <div class="form-group">
            <label for="target_date">Target Date <span class="req">*</span></label>
            <input type="date" id="target_date" name="target_date" />
            <span class="field-error" data-for="target_date">Target date is required</span>
          </div>
          <div class="form-group">
            <label for="status">Status <span class="req">*</span></label>
            <select id="status" name="status">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span id="submitText">Add Course</span>
            </button>
            <button type="button" class="btn btn-ghost" id="resetBtn">Clear</button>
          </div>
        </form>
      </div>

      <!-- Course List -->
      <h2 class="section-title">
        <span class="icon">&#9776;</span> Your Courses
      </h2>
      <div id="courseList"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <div class="modal-header">
          <h2>Edit Course</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <form id="editForm" class="form-grid" novalidate>
          <input type="hidden" id="editId" />
          <div class="form-group full">
            <label for="editName">Course Name <span class="req">*</span></label>
            <input type="text" id="editName" />
            <span class="field-error" data-for="editName">Course name is required</span>
          </div>
          <div class="form-group full">
            <label for="editDescription">Description <span class="req">*</span></label>
            <textarea id="editDescription"></textarea>
            <span class="field-error" data-for="editDescription">Description is required</span>
          </div>
          <div class="form-group">
            <label for="editTargetDate">Target Date <span class="req">*</span></label>
            <input type="date" id="editTargetDate" />
            <span class="field-error" data-for="editTargetDate">Target date is required</span>
          </div>
          <div class="form-group">
            <label for="editStatus">Status <span class="req">*</span></label>
            <select id="editStatus">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-success" id="saveEditBtn">
              <span id="saveEditText">Save Changes</span>
            </button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
      const API_URL = 'http://127.0.0.1:5000/api/courses';

      // ---- State ----
      let courses = [];

      // ---- DOM refs ----
      const courseListEl = document.getElementById('courseList');
      const courseForm = document.getElementById('courseForm');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const resetBtn = document.getElementById('resetBtn');
      const editModal = document.getElementById('editModal');
      const editForm = document.getElementById('editForm');
      const closeModalBtn = document.getElementById('closeModal');
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      const saveEditBtn = document.getElementById('saveEditBtn');
      const saveEditText = document.getElementById('saveEditText');
      const toastContainer = document.getElementById('toastContainer');

      // ---- Toast notifications ----
      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('removing');
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      // ---- Loading helpers ----
      function showLoading() {
        courseListEl.innerHTML = `
          <div class="loading-overlay">
            <div class="spinner"></div>
            <p>Loading courses...</p>
          </div>`;
      }

      function showEmpty() {
        courseListEl.innerHTML = `
          <div class="empty-state">
            <div class="emoji">&#128218;</div>
            <h3>No courses yet</h3>
            <p>Add your first course using the form above.</p>
          </div>`;
      }

      function showSpinnerInBtn(btn, textEl, originalText) {
        btn.disabled = true;
        textEl.innerHTML = '<span class="spinner"></span>';
        btn._originalText = originalText;
      }

      function restoreBtn(btn, textEl) {
        btn.disabled = false;
        textEl.textContent = btn._originalText || '';
      }

      // ---- Status badge helper ----
      function statusBadge(status) {
        const map = {
          'Not Started': 'badge-not-started',
          'In Progress': 'badge-in-progress',
          'Completed': 'badge-completed'
        };
        const cls = map[status] || 'badge-not-started';
        return `<span class="badge ${cls}">${status}</span>`;
      }

      // ---- Date formatting ----
      function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      // ---- Render courses ----
      function renderCourses() {
        if (!courses.length) {
          showEmpty();
          return;
        }
        courseListEl.innerHTML = `
          <div class="course-list">
            ${courses.map(c => `
              <div class="course-card" data-id="${c.id}">
                <div class="course-card-header">
                  <div>
                    <div class="course-name">${escapeHtml(c.name)}</div>
                    <div class="course-meta">
                      <span>&#128197; Target: ${formatDate(c.target_date)}</span>
                      <span>&#128338; Created: ${formatDate(c.created_at)}</span>
                      ${statusBadge(c.status)}
                    </div>
                  </div>
                  <div class="course-actions">
                    <button class="btn btn-primary btn-sm" onclick="openEditModal(${c.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCourse(${c.id})">Remove</button>
                  </div>
                </div>
                ${c.description ? `<div class="course-desc">${escapeHtml(c.description)}</div>` : ''}
              </div>
            `).join('')}
          </div>`;
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ---- Validation ----
      function validateForm(formId) {
        let valid = true;
        const form = document.getElementById(formId);
        const fields = formId === 'courseForm'
          ? ['name', 'description', 'target_date']
          : ['editName', 'editDescription', 'editTargetDate'];

        // Clear previous errors
        form.querySelectorAll('.field-error').forEach(e => e.classList.remove('visible'));
        form.querySelectorAll('input, textarea, select').forEach(el => el.classList.remove('error'));

        fields.forEach(id => {
          const el = document.getElementById(id);
          if (!el.value.trim()) {
            const err = form.querySelector(`.field-error[data-for="${id}"]`);
            if (err) err.classList.add('visible');
            el.classList.add('error');
            valid = false;
          }
        });

        return valid;
      }

      // ---- API: Fetch all courses ----
      async function fetchCourses() {
        showLoading();
        try {
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error(`Failed to fetch courses (${res.status})`);
          const data = await res.json();
          courses = Array.isArray(data) ? data : (data.courses || []);
          renderCourses();
        } catch (err) {
          courseListEl.innerHTML = `
            <div class="empty-state">
              <div class="emoji">&#9888;&#65039;</div>
              <h3>Failed to load courses</h3>
              <p>${escapeHtml(err.message)}. Make sure the API server is running at ${API_URL}.</p>
              <button class="btn btn-primary" style="margin-top:1rem" onclick="fetchCourses()">Retry</button>
            </div>`;
          showToast('Failed to load courses', 'error');
        }
      }

      // ---- API: Create course ----
      courseForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validateForm('courseForm')) {
          showToast('Please fill in all required fields', 'error');
          return;
        }

        const payload = {
          name: document.getElementById('name').value.trim(),
          description: document.getElementById('description').value.trim(),
          target_date: document.getElementById('target_date').value,
          status: document.getElementById('status').value
        };

        showSpinnerInBtn(submitBtn, submitText, 'Add Course');
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `Failed to create course (${res.status})`);
          }
          const created = await res.json();
          showToast('Course added successfully!', 'success');
          courseForm.reset();
          document.getElementById('status').value = 'Not Started';
          await fetchCourses();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          restoreBtn(submitBtn, submitText);
        }
      });

      resetBtn.addEventListener('click', () => {
        courseForm.reset();
        document.getElementById('status').value = 'Not Started';
        document.querySelectorAll('#courseForm .field-error').forEach(e => e.classList.remove('visible'));
        document.querySelectorAll('#courseForm input, #courseForm textarea').forEach(el => el.classList.remove('error'));
      });

      // ---- Edit Modal ----
      window.openEditModal = function(id) {
        const course = courses.find(c => c.id === id);
        if (!course) return;
        document.getElementById('editId').value = course.id;
        document.getElementById('editName').value = course.name || '';
        document.getElementById('editDescription').value = course.description || '';
        document.getElementById('editTargetDate').value = course.target_date || '';
        document.getElementById('editStatus').value = course.status || 'Not Started';
        // Clear errors
        editForm.querySelectorAll('.field-error').forEach(e => e.classList.remove('visible'));
        editForm.querySelectorAll('input, textarea, select').forEach(el => el.classList.remove('error'));
        editModal.classList.add('active');
      };

      function closeEditModal() {
        editModal.classList.remove('active');
      }

      closeModalBtn.addEventListener('click', closeEditModal);
      cancelEditBtn.addEventListener('click', closeEditModal);
      editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
      });

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validateForm('editForm')) {
          showToast('Please fill in all required fields', 'error');
          return;
        }

        const id = document.getElementById('editId').value;
        const payload = {
          name: document.getElementById('editName').value.trim(),
          description: document.getElementById('editDescription').value.trim(),
          target_date: document.getElementById('editTargetDate').value,
          status: document.getElementById('editStatus').value
        };

        showSpinnerInBtn(saveEditBtn, saveEditText, 'Save Changes');
        try {
          const res = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `Failed to update course (${res.status})`);
          }
          showToast('Course updated successfully!', 'success');
          closeEditModal();
          await fetchCourses();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          restoreBtn(saveEditBtn, saveEditText);
        }
      });

      // ---- API: Delete course ----
      window.deleteCourse = async function(id) {
        if (!confirm('Are you sure you want to remove this course?')) return;
        try {
          const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `Failed to delete course (${res.status})`);
          }
          showToast('Course removed successfully!', 'success');
          await fetchCourses();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // ---- Init ----
      fetchCourses();
    </script>
  </body>
</html>
